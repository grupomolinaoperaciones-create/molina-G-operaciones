<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centro de Seguimiento Operativo — Molina Group</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --vino:#7B1F3A;--vino-light:#F5EAF0;--vino-mid:#B5566F;
  --crema:#FAF6EF;--crema-dark:#EDE7D8;
  --verde:#4A7C3F;--gris:#6B6560;--text:#2C2117;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F2EFE9;min-height:100vh;padding:1.5rem}
.container{max-width:1100px;margin:0 auto}
.topbar{background:var(--vino);border-radius:12px;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:10px}
.brand{display:flex;align-items:center;gap:12px}
.logo-circle{width:46px;height:46px;border-radius:50%;background:#FAF6EF;border:2.5px solid #B5566F;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-text{display:flex;flex-direction:column;line-height:1.2}
.logo-name{font-size:16px;font-weight:600;color:#FAF6EF;letter-spacing:.04em}
.logo-sub{font-size:11px;color:#E0C8D0;letter-spacing:.12em}
.sep{width:1px;height:30px;background:rgba(255,255,255,.2);margin:0 8px}
.app-title{font-size:15px;font-weight:500;color:#FAF6EF}
.app-date{font-size:11px;color:#D9BCC6}
.nav-tabs{display:flex;gap:4px;flex-wrap:wrap}
.ntab{background:transparent;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:6px 14px;font-size:12px;color:rgba(255,255,255,.7);cursor:pointer}
.ntab.active,.ntab:hover{background:rgba(255,255,255,.18);color:#FAF6EF;border-color:rgba(255,255,255,.5)}
.status-bar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--gris);margin-bottom:1rem;flex-wrap:wrap;background:var(--crema);border:1px solid var(--crema-dark);border-radius:10px;padding:10px 14px}
.sdot{width:9px;height:9px;border-radius:50%;background:var(--verde);flex-shrink:0}
.sdot.cargando{background:#C87D1A;animation:pulso 1s infinite}
.sdot.error{background:#B83232}
@keyframes pulso{0%,100%{opacity:1}50%{opacity:.3}}
.reload-btn{margin-left:auto;background:var(--vino);color:#FAF6EF;border:none;border-radius:8px;padding:5px 14px;font-size:12px;cursor:pointer;font-weight:500}
.reload-btn:hover{background:var(--vino-mid)}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.25rem}
.metric{background:var(--crema);border:1px solid var(--crema-dark);border-radius:10px;padding:12px 14px}
.metric-label{font-size:11px;color:var(--gris);margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em}
.metric-val{font-size:24px;font-weight:500;color:var(--text)}
.section-title{font-size:14px;font-weight:500;color:var(--vino);display:flex;align-items:center;gap:6px;margin-bottom:10px;padding-left:8px;border-left:3px solid var(--vino)}
.ger-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:1.5rem}
.ger-card{background:#fff;border:1px solid var(--crema-dark);border-radius:12px;padding:14px 16px}
.ger-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.ger-name{font-size:13px;font-weight:500;color:var(--text)}
.ger-count{font-size:11px;color:var(--gris);margin-top:2px}
.ger-pct{font-size:22px;font-weight:500;line-height:1}
.ger-pct-label{font-size:11px;color:var(--gris)}
.prog-track{height:6px;background:var(--crema-dark);border-radius:3px;margin:8px 0;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;transition:width .4s}
.ger-stats{display:flex;gap:8px;flex-wrap:wrap}
.ger-stat{font-size:11px;color:var(--gris);display:flex;align-items:center;gap:3px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.filters{display:flex;gap:7px;flex-wrap:wrap}
.fsel,.finput{font-size:12px;border-radius:8px;padding:6px 10px;border:1px solid var(--crema-dark);background:var(--crema);color:var(--text)}
.finput{width:160px}
.add-btn{background:var(--vino);border:none;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:500;color:#FAF6EF;cursor:pointer}
.add-btn:hover{background:var(--vino-mid)}
.table-wrap{border:1px solid var(--crema-dark);border-radius:12px;overflow:hidden;margin-bottom:1rem}
.data-table{width:100%;border-collapse:collapse;table-layout:fixed}
.data-table th{font-size:11px;font-weight:500;color:var(--vino);padding:10px 12px;text-align:left;background:var(--crema);border-bottom:1px solid var(--crema-dark);text-transform:uppercase;letter-spacing:.04em}
.data-table td{font-size:12px;color:var(--text);padding:10px 12px;border-bottom:1px solid var(--crema-dark);vertical-align:middle;background:#fff}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:var(--crema)}
.badge{display:inline-flex;font-size:11px;padding:3px 9px;border-radius:20px;font-weight:500;white-space:nowrap}
.b-pend{background:#FEF3E2;color:#7A4A0A;border:1px solid #F5C97A}
.b-proc{background:#EAF2FB;color:#1A4F82;border:1px solid #A0C4E8}
.b-done{background:#EAF2E8;color:#27500A;border:1px solid #8CC47E}
.b-atras{background:#FCEBEB;color:#7A1F1F;border:1px solid #F09595}
.area-tag{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--vino-light);color:var(--vino);border:1px solid #D4A0B5;white-space:nowrap}
.pri-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}
.action-btn{background:transparent;border:none;cursor:pointer;color:var(--gris);padding:4px;border-radius:6px;font-size:14px}
.action-btn:hover{color:var(--vino);background:var(--vino-light)}
.kanban-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.k-col{background:var(--crema);border:1px solid var(--crema-dark);border-radius:10px;padding:10px}
.k-header{font-size:12px;font-weight:500;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.k-count{font-size:11px;background:#fff;border:1px solid var(--crema-dark);border-radius:20px;padding:1px 7px;color:var(--gris)}
.k-card{background:#fff;border:1px solid var(--crema-dark);border-radius:8px;padding:10px;margin-bottom:7px}
.k-card-title{font-size:12px;font-weight:500;color:var(--text);margin-bottom:5px;line-height:1.4}
.k-card-meta{font-size:11px;color:var(--gris);display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(44,33,23,.45);z-index:100;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal-box{background:#fff;border-radius:14px;padding:1.5rem;width:520px;max-width:95vw;max-height:90vh;overflow-y:auto}
.modal-title{font-size:15px;font-weight:600;color:var(--vino);margin-bottom:1rem}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group.full{grid-column:1/-1}
.form-label{font-size:11px;color:var(--gris);text-transform:uppercase;letter-spacing:.05em}
.form-input{font-size:13px;padding:7px 10px;border:1px solid var(--crema-dark);border-radius:8px;background:var(--crema);color:var(--text)}
.range-wrap{display:flex;align-items:center;gap:8px}
.range-wrap input[type=range]{flex:1}
.range-val{font-size:12px;font-weight:500;color:var(--vino);min-width:32px}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:1rem}
.btn-save{background:var(--vino);color:#FAF6EF;border:none;border-radius:8px;padding:8px 20px;font-size:13px;font-weight:500;cursor:pointer}
.btn-cancel{background:transparent;border:1px solid var(--crema-dark);border-radius:8px;padding:8px 16px;font-size:13px;color:var(--gris);cursor:pointer}
.hidden{display:none}
@media(max-width:700px){.metrics{grid-template-columns:repeat(2,1fr)}.ger-grid{grid-template-columns:1fr}.kanban-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="container">

  <div class="topbar">
    <div class="brand">
      <div class="logo-circle">
        <svg width="30" height="28" viewBox="0 0 30 28" fill="none">
          <circle cx="15" cy="7" r="5" fill="#7AB870"/>
          <circle cx="9" cy="12" r="4.5" fill="#5A9E52"/>
          <circle cx="21" cy="12" r="4.5" fill="#5A9E52"/>
          <circle cx="12" cy="18" r="4" fill="#7AB870"/>
          <circle cx="18" cy="18" r="4" fill="#7AB870"/>
          <circle cx="15" cy="23" r="3.5" fill="#5A9E52"/>
          <rect x="14" y="1" width="2" height="5" rx="1" fill="#4A7C3F"/>
          <path d="M16 2 Q20 0 22 3" stroke="#4A7C3F" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="logo-text"><span class="logo-name">MOLINA</span><span class="logo-sub">GROUP</span></div>

      <button class="ntab" id="tab-tabla" onclick="setTab('tabla')">📋 Tabla</button>

  <div id="vista-tabla" class="hidden">
    <div class="toolbar">

        <select class="fsel" id="f-area" onchange="renderAll()">
          <option value="">Todas las gerencias</option>
          <option>Mantenimiento eléctrico</option><option>Taller automotriz</option>

          <option>Calidad</option><option>Empaques de uva</option>
        </select>
        <select class="fsel" id="f-est" onchange="renderAll()">
          <option value="">Todos los estatus</option>

        </select>
        <select class="fsel" id="f-pri" onchange="renderAll()">
          <option value="">Todas las prioridades</option>
          <option>Alta</option><option>Media</option><option>Baja</option>
        </select>
        <select class="fsel" id="f-campo" onchange="renderAll()">
          <option value="">Todos los campos</option>
          <option>Las Mercedes</option>
          <option>La Navidad</option>
          <option>Los Vergeles</option>
          <option>Santa María</option>
          <option>Don Roberto</option>
        </select>
        <select class="fsel" id="f-resp" onchange="renderAll()">
          <option value="">Todos los responsables</option>
        </select>
        <input class="finput" id="f-bus" placeholder="Buscar..." oninput="renderAll()">
        <button class="fsel" onclick="limpiarFiltros()" style="cursor:pointer;color:var(--gris)">✕ Limpiar</button>
      </div>
      <button class="add-btn" onclick="openModal()">+ Nuevo pendiente</button>

    <div class="table-wrap">

            <option>Mantenimiento eléctrico</option><option>Taller automotriz</option>

<script>
// ── TU URL DE APPS SCRIPT ─────────────────────────────────
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyTgSA76-lyiJrxM-hkl0piMC4cDIzGErWO_LXTeveCIWO5zP5vHu2fRsH80zNW2jqGkg/exec';

const GERENCIAS = ['Mantenimiento eléctrico','Taller automotriz','Maquinaria agrícola','Construcciones','Calidad','Empaques de uva'];
const GER_ICONS = {'Mantenimiento eléctrico':'⚡','Taller automotriz':'🚗','Maquinaria agrícola':'🚜','Construcciones':'🏗','Calidad':'✅','Empaques de uva':'📦'};
const COL_MAP = {
  id:          ['id del pendiente','id pendiente','id','folio','clave'],
  campo:       ['campo'],
  gerencia:    ['gerencia'],
  desc:        ['descripci','pendiente','descripcion'],
  responsable: ['responsable'],
  prioridad:   ['prioridad'],
  fecha:       ['fecha'],
  estatus:     ['estatus','status','estado'],
  pct:         ['avance','%','porcentaje'],
  avance:      ['comentario','nota','observaci'],
};

const hoy = new Date();
document.getElementById('fecha-hoy').textContent = hoy.toLocaleDateString('es-MX',{weekday:'long',year:'numeric',month:'long',day:'numeric'});

let tab='resumen', editIdx=null, pendientes=[];

// ── CARGA CON JSONP (evita CORS en archivos locales) ──────
function cargarDatos() {
  setStatus('cargando','Conectando con Google Sheet...');
  // Usamos JSONP: inyectamos un <script> que llama al Apps Script
  // El Apps Script debe devolver JSON plano (ya lo hace con doGet)
  var callbackName = 'cb_' + Date.now();
  var script = document.createElement('script');
  var timeout = setTimeout(function(){
    // Si tarda más de 8s, cargar ejemplos
    if(window[callbackName]) delete window[callbackName];
    script.remove();
    setStatus('error','No se pudo conectar — verifica que el Apps Script esté publicado correctamente');
    cargarEjemplos();
  }, 8000);

  window[callbackName] = function(data) {
    clearTimeout(timeout);
    delete window[callbackName];
    script.remove();
    try {
      procesarDatos(data);
    } catch(e) {
      setStatus('error','Error al procesar datos: ' + e.message);
      cargarEjemplos();
    }
  };

  // Apps Script con callback para JSONP
  script.src = SCRIPT_URL + '?callback=' + callbackName;
  script.onerror = function(){
    clearTimeout(timeout);
    delete window[callbackName];
    // Fallback: intentar fetch normal
    intentarFetch();
  };
  document.head.appendChild(script);
}

function intentarFetch() {
  setStatus('cargando','Intentando conexión alternativa...');
  fetch(SCRIPT_URL)
    .then(function(r){ return r.json(); })
    .then(function(data){ procesarDatos(data); })
    .catch(function(e){
      setStatus('error','Sin conexión al Sheet — mostrando datos de ejemplo. Sube el archivo a GitHub Pages para conexión completa.');
      cargarEjemplos();
    });
}

function procesarDatos(json) {
  if (!Array.isArray(json) || json.length === 0) {
    setStatus('ok','Sheet conectado ✓ — aún sin registros. Agrega pendientes desde el Form o con el botón.');
    pendientes = [];
    renderAll();
    return;
  }
  var keys = Object.keys(json[0]);
  var map = {};
  Object.keys(COL_MAP).forEach(function(field){
    keys.forEach(function(k){
      if(map[field]) return;
      var kl = k.toLowerCase();
      COL_MAP[field].forEach(function(m){ if(kl.includes(m)) map[field]=k; });
    });
  });
  // Mapear todas las filas
  var todas = json.map(function(row){
    var pctRaw = map.pct ? String(row[map.pct]||'0') : '0';
    var pctNum = parseInt(pctRaw.replace(/[^0-9]/g,''))||0;
    var est = map.estatus ? String(row[map.estatus]||'Pendiente').trim() : 'Pendiente';
    if(est==='Completado') pctNum=100;
    return {
      id:          map.id ? String(row[map.id]||'').trim().toUpperCase() : '',
      campo:       map.campo ? String(row[map.campo]||'').trim() : '',
      desc:        map.desc ? String(row[map.desc]||'').trim() : '',
      gerencia:    map.gerencia ? String(row[map.gerencia]||'').trim() : '',
      responsable: map.responsable ? String(row[map.responsable]||'').trim() : '',
      prioridad:   map.prioridad ? String(row[map.prioridad]||'Media').trim() : 'Media',
      fecha:       map.fecha ? parseFecha(String(row[map.fecha]||'')) : '',
      estatus:     est,
      avance:      map.avance ? String(row[map.avance]||'').trim() : '',
      pct:         pctNum,
    };
  }).filter(function(p){ return p.desc; });

  // Agrupar por ID — solo el registro mas reciente de cada ID
  var porId = {};
  todas.forEach(function(p){
    var key = p.id || p.desc;
    porId[key] = p;
  });
  pendientes = Object.values(porId);

  var total = todas.length;
  var unicos = pendientes.length;
  var act = total - unicos;
  var msg = 'Sheet conectado ✓ · '+unicos+' pendientes';
  if(act > 0) msg += ' · '+act+' actualización'+( act!==1?'es':'');
  msg += ' · '+new Date().toLocaleTimeString('es-MX');
  setStatus('ok', msg);
  renderAll();
}

function cargarEjemplos(){
  pendientes=[
    {desc:'Revisión de transformador principal',gerencia:'Mantenimiento eléctrico',responsable:'Carlos Ruiz',prioridad:'Alta',fecha:'2026-05-20',estatus:'En proceso',avance:'Refacción solicitada',pct:40},
    {desc:'Mantenimiento preventivo camioneta F-250',gerencia:'Taller automotriz',responsable:'Luis Méndez',prioridad:'Media',fecha:'2026-05-22',estatus:'Pendiente',avance:'',pct:0},
    {desc:'Calibración de tractores John Deere',gerencia:'Maquinaria agrícola',responsable:'Ernesto López',prioridad:'Alta',fecha:'2026-05-18',estatus:'Atrasado',avance:'Pendiente técnico',pct:15},
    {desc:'Revisión estructura bodega norte',gerencia:'Construcciones',responsable:'Ramón Torres',prioridad:'Media',fecha:'2026-05-28',estatus:'En proceso',avance:'Inicio el lunes',pct:60},
    {desc:'Auditoría interna proceso empaque',gerencia:'Calidad',responsable:'Ana García',prioridad:'Alta',fecha:'2026-05-19',estatus:'Completado',avance:'Reporte enviado',pct:100},
    {desc:'Inventario cajas temporada 2026',gerencia:'Empaques de uva',responsable:'Pedro Soto',prioridad:'Media',fecha:'2026-05-25',estatus:'Pendiente',avance:'',pct:0},
    {desc:'Reparación tablero eléctrico sector 3',gerencia:'Mantenimiento eléctrico',responsable:'Carlos Ruiz',prioridad:'Alta',fecha:'2026-05-17',estatus:'Atrasado',avance:'Esperando cotización',pct:5},
    {desc:'Calibración báscula empaque',gerencia:'Empaques de uva',responsable:'Pedro Soto',prioridad:'Alta',fecha:'2026-05-21',estatus:'En proceso',avance:'Técnico agendado',pct:30},

    {desc:'Revisión bomba hidráulica',gerencia:'Maquinaria agrícola',responsable:'Ernesto López',prioridad:'Media',fecha:'2026-05-30',estatus:'Pendiente',avance:'',pct:0},
    {desc:'Instalación riego sector 4',gerencia:'Construcciones',responsable:'Ramón Torres',prioridad:'Media',fecha:'2026-06-05',estatus:'Pendiente',avance:'',pct:0},

function parseFecha(s){
  if(!s) return '';
  s = String(s).trim();
  // Formato Google Forms: MM/DD/YYYY o M/D/YYYY
  var p = s.split(/[\/\-]/);
  if(p.length===3){
    if(p[0].length===4) return s; // ya es YYYY-MM-DD
    // Detectar si es MM/DD/YYYY (Google Forms) o DD/MM/YYYY
    var a = parseInt(p[0]), b = parseInt(p[1]), anio = parseInt(p[2]);
    if(anio > 1900){
      // Es MM/DD/YYYY de Google Forms
      return anio+'-'+String(a).padStart(2,'0')+'-'+String(b).padStart(2,'0');
    }
    // Es DD/MM/YYYY
    return p[2]+'-'+p[1].padStart(2,'0')+'-'+p[0].padStart(2,'0');
  }
  return '';
}
function setStatus(estado,msg){
  var d=document.getElementById('sdot');
  d.className='sdot'+(estado==='cargando'?' cargando':estado==='error'?' error':'');
  document.getElementById('stxt').textContent=msg;
}
function setTab(t){
  tab=t;
  ['resumen','tabla','kanban'].forEach(function(v){
    document.getElementById('vista-'+v).classList.toggle('hidden',v!==t);
    document.getElementById('tab-'+v).classList.toggle('active',v===t);
  });
  renderAll();
}
function isAtrasado(p){return p.fecha&&p.estatus!=='Completado'&&new Date(p.fecha+'T12:00:00')<hoy;}
function pctColor(n){if(n>=80) return'#3B6D11';if(n>=40) return'#1A4F82';if(n>0) return'#C87D1A';return'#B83232';}
function badgeEst(e){var m={Pendiente:'b-pend','En proceso':'b-proc',Completado:'b-done',Atrasado:'b-atras'};return'<span class="badge '+(m[e]||'b-pend')+'">'+e+'</span>';}
function priDot(p){var c={Alta:'#B83232',Media:'#C87D1A',Baja:'#4A7C3F'};return'<span class="pri-dot" style="background:'+(c[p]||c.Media)+'"></span>'+p;}
function fmtFecha(f){if(!f) return'—';return new Date(f+'T12:00:00').toLocaleDateString('es-MX',{day:'2-digit',month:'short'});}
function gerStats(g){
  var items=pendientes.filter(function(p){return p.gerencia===g;});
  if(!items.length) return null;
  var total=items.length,done=0,proc=0,pend=0,atr=0,sumP=0;
  items.forEach(function(p){
    if(p.estatus==='Completado') done++;
    else if(p.estatus==='En proceso') proc++;
    else if(p.estatus==='Atrasado'||isAtrasado(p)) atr++;
    else pend++;
    sumP+=(p.pct||0);
  });
  return{total:total,done:done,proc:proc,pend:pend,atr:atr,avg:Math.round(sumP/total)};
}
function getFiltered(){
  var area=(document.getElementById('f-area')||{value:''}).value;
  var est=(document.getElementById('f-est')||{value:''}).value;
  var pri=(document.getElementById('f-pri')||{value:''}).value;
  var resp=(document.getElementById('f-resp')||{value:''}).value;
  var campo=(document.getElementById('f-campo')||{value:''}).value;
  var bus=((document.getElementById('f-bus')||{value:''}).value).toLowerCase();
  return pendientes.filter(function(p){
    return(!area||p.gerencia===area)&&(!est||p.estatus===est)&&(!pri||p.prioridad===pri)&&
           (!resp||p.responsable===resp)&&(!campo||p.campo===campo)&&
           (!bus||p.desc.toLowerCase().includes(bus)||p.responsable.toLowerCase().includes(bus));
  });
}
function renderMetrics(){
  var t=pendientes.length,enP=0,atr=0,done=0,sumP=0;
  pendientes.forEach(function(p){
    if(p.estatus==='En proceso') enP++;
    if(p.estatus==='Atrasado'||isAtrasado(p)) atr++;
    if(p.estatus==='Completado') done++;
    sumP+=(p.pct||0);
  });
  var avg=t?Math.round(sumP/t):0;
  document.getElementById('metrics-row').innerHTML=
    '<div class="metric"><div class="metric-label">Total pendientes</div><div class="metric-val">'+t+'</div></div>'+
    '<div class="metric"><div class="metric-label">En proceso</div><div class="metric-val" style="color:var(--vino)">'+enP+'</div></div>'+
    '<div class="metric"><div class="metric-label">Atrasados</div><div class="metric-val" style="color:#B83232">'+atr+'</div></div>'+
    '<div class="metric"><div class="metric-label">Avance global</div><div class="metric-val" style="color:#3B6D11">'+avg+'%</div></div>';
}
function renderGerencias(){
  document.getElementById('ger-grid').innerHTML=GERENCIAS.map(function(g){
    var s=gerStats(g);if(!s) return'';
    var c=pctColor(s.avg);
    return'<div class="ger-card">'+
      '<div class="ger-header"><div><div class="ger-name">'+GER_ICONS[g]+' '+g+'</div><div class="ger-count">'+s.total+' pendiente'+(s.total!==1?'s':'')+'</div></div>'+
      '<div style="text-align:right"><div class="ger-pct" style="color:'+c+'">'+s.avg+'%</div><div class="ger-pct-label">avance</div></div></div>'+
      '<div class="prog-track"><div class="prog-fill" style="width:'+s.avg+'%;background:'+c+'"></div></div>'+
      '<div class="ger-stats">'+
        '<span class="ger-stat"><span class="dot" style="background:#C87D1A"></span>'+s.pend+' pend.</span>'+
        '<span class="ger-stat"><span class="dot" style="background:#1A4F82"></span>'+s.proc+' proc.</span>'+
        (s.atr?'<span class="ger-stat"><span class="dot" style="background:#B83232"></span>'+s.atr+' atras.</span>':'')+
        '<span class="ger-stat"><span class="dot" style="background:#3B6D11"></span>'+s.done+' comp.</span>'+
      '</div></div>';
  }).join('');
}
function renderResumenTabla(){
  document.getElementById('resumen-body').innerHTML=GERENCIAS.map(function(g){
    var s=gerStats(g);
    if(!s) return'<tr><td>'+GER_ICONS[g]+' '+g+'</td><td colspan="7" style="color:var(--gris);font-size:12px">Sin registros aún</td></tr>';
    var c=pctColor(s.avg);
    var alerta=s.atr>0?'<span class="badge b-atras">'+s.atr+' atrasado'+(s.atr!==1?'s':'')+'</span>':
      s.avg>=80?'<span class="badge b-done">Buen ritmo</span>':
      s.pend===s.total?'<span class="badge b-pend">Sin iniciar</span>':'<span class="badge b-proc">En curso</span>';
    return'<tr>'+
      '<td><span style="font-weight:500">'+GER_ICONS[g]+' '+g+'</span></td>'+
      '<td style="text-align:center;font-weight:500">'+s.total+'</td>'+
      '<td style="color:#7A4A0A">'+s.pend+'</td>'+
      '<td style="color:#1A4F82">'+s.proc+'</td>'+
      '<td style="color:'+(s.atr?'#B83232':'var(--gris)')+';font-weight:'+(s.atr?'500':'400')+'">'+s.atr+'</td>'+
      '<td style="color:#27500A">'+s.done+'</td>'+
      '<td><div style="display:flex;align-items:center;gap:8px"><div style="flex:1;height:8px;background:var(--crema-dark);border-radius:4px;overflow:hidden"><div style="height:100%;width:'+s.avg+'%;background:'+c+';border-radius:4px"></div></div><span style="font-size:12px;font-weight:500;color:'+c+';min-width:30px">'+s.avg+'%</span></div></td>'+
      '<td>'+alerta+'</td></tr>';
  }).join('');
}
function renderTabla(){
  var list=getFiltered(),tbody=document.getElementById('tabla-body');
  if(!list.length){tbody.innerHTML='<tr><td colspan="8" style="text-align:center;color:var(--gris);padding:24px">Sin resultados</td></tr>';return;}
  tbody.innerHTML=list.map(function(p){
    var ri=pendientes.indexOf(p),atras=isAtrasado(p)&&p.estatus!=='Completado',c=pctColor(p.pct||0);
    return'<tr>'+
      '<td><span style="font-weight:500">'+p.desc+'</span>'+(p.avance?'<div style="font-size:11px;color:var(--gris);margin-top:2px">'+p.avance+'</div>':'')+'</td>'+
      '<td><span class="area-tag">'+p.gerencia+'</span></td>'+'<td style="font-size:12px;color:var(--gris)">'+( p.campo||'—')+'</td>'+
      '<td>'+priDot(p.prioridad)+'</td>'+
      '<td>'+badgeEst(p.estatus)+'</td>'+
      '<td style="color:var(--gris)">'+p.responsable+'</td>'+
      '<td><div style="display:flex;align-items:center;gap:6px"><div style="flex:1;height:6px;background:var(--crema-dark);border-radius:3px;overflow:hidden"><div style="height:100%;width:'+(p.pct||0)+'%;background:'+c+';border-radius:3px"></div></div><span style="font-size:11px;font-weight:500;color:'+c+';min-width:28px">'+(p.pct||0)+'%</span></div></td>'+
      '<td style="color:'+(atras?'#B83232':'var(--text)')+';font-size:12px">'+fmtFecha(p.fecha)+'</td>'+
      '<td>'+
        '<button class="action-btn" onclick="editarItem('+ri+')" title="Editar">✏️</button>'+
        '<button class="action-btn" onclick="avanzarEstatus('+ri+')" title="Cambiar">🔄</button>'+
        '<button class="action-btn" onclick="eliminar('+ri+')" title="Eliminar">🗑</button>'+
      '</td></tr>';
  }).join('');
}
function renderKanban(){
  var list=getFiltered();
  var cols=['Pendiente','En proceso','Atrasado','Completado'];
  var cc={Pendiente:'#C87D1A','En proceso':'#1A4F82',Atrasado:'#B83232',Completado:'#3B6D11'};
  document.getElementById('kanban-body').innerHTML=cols.map(function(col){
    var items=list.filter(function(p){return p.estatus===col;});
    var cards=items.map(function(p){
      var c=pctColor(p.pct||0);
      return'<div class="k-card"><div class="k-card-title">'+p.desc+'</div>'+
        '<div class="k-card-meta"><span class="area-tag" style="font-size:10px">'+p.gerencia.split(' ')[0]+'</span>'+priDot(p.prioridad)+'</div>'+
        '<div style="display:flex;align-items:center;gap:6px;margin-top:7px"><div style="flex:1;height:4px;background:var(--crema-dark);border-radius:2px;overflow:hidden"><div style="height:100%;width:'+(p.pct||0)+'%;background:'+c+';border-radius:2px"></div></div>'+
        '<span style="font-size:10px;font-weight:500;color:'+c+'">'+(p.pct||0)+'%</span></div></div>';
    }).join('')||'<div style="font-size:11px;color:var(--gris);text-align:center;padding:12px 0">Sin pendientes</div>';
    return'<div class="k-col"><div class="k-header"><span style="color:'+cc[col]+'">'+col+'</span><span class="k-count">'+items.length+'</span></div>'+cards+'</div>';
  }).join('');
}
function renderAll(){
  actualizarFiltroResponsables();
  renderMetrics();
  if(tab==='resumen'){renderGerencias();renderResumenTabla();}
  else if(tab==='tabla') renderTabla();
  else renderKanban();
}

function actualizarFiltroResponsables(){
  var sel=document.getElementById('f-resp');
  if(!sel) return;
  var actual=sel.value;
  var lista=[];
  pendientes.forEach(function(p){ if(p.responsable&&lista.indexOf(p.responsable)===-1) lista.push(p.responsable); });
  lista.sort();
  sel.innerHTML='<option value="">Todos los responsables</option>';
  lista.forEach(function(r){ var o=document.createElement('option');o.value=r;o.textContent=r;if(r===actual)o.selected=true;sel.appendChild(o); });
}

function limpiarFiltros(){
  ['f-area','f-est','f-pri','f-campo','f-resp'].forEach(function(id){var el=document.getElementById(id);if(el)el.value='';});
  var b=document.getElementById('f-bus');if(b)b.value='';
  renderAll();
}
  else if(tab==='tabla') renderTabla();
  else renderKanban();
}
function openModal(){
  editIdx=null;
  ['m-desc','m-resp','m-avance'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('m-fecha').value='';
  document.getElementById('m-pri').value='Alta';
  document.getElementById('m-est').value='Pendiente';
  document.getElementById('m-gcia').value='Mantenimiento eléctrico';
  document.getElementById('m-pct').value=0;
  document.getElementById('pct-lbl').textContent='0%';
  document.getElementById('modal-ttl').textContent='Registrar nuevo pendiente';
  document.getElementById('modal-bg').classList.add('open');
}
function closeModal(){document.getElementById('modal-bg').classList.remove('open');}
document.getElementById('modal-bg').addEventListener('click',function(e){if(e.target===this)closeModal();});
function guardar(){
  var desc=document.getElementById('m-desc').value.trim();
  if(!desc){document.getElementById('m-desc').style.borderColor='#B83232';return;}
  document.getElementById('m-desc').style.borderColor='';
  var item={desc:desc,gerencia:document.getElementById('m-gcia').value,responsable:document.getElementById('m-resp').value||'Sin asignar',
    prioridad:document.getElementById('m-pri').value,fecha:document.getElementById('m-fecha').value,
    estatus:document.getElementById('m-est').value,avance:document.getElementById('m-avance').value,
    pct:parseInt(document.getElementById('m-pct').value)};
  if(editIdx!==null) pendientes[editIdx]=item; else pendientes.unshift(item);
  closeModal();renderAll();
}
function editarItem(idx){
  editIdx=idx;var p=pendientes[idx];
  document.getElementById('m-desc').value=p.desc;document.getElementById('m-gcia').value=p.gerencia;
  document.getElementById('m-resp').value=p.responsable;document.getElementById('m-pri').value=p.prioridad;
  document.getElementById('m-fecha').value=p.fecha;document.getElementById('m-est').value=p.estatus;
  document.getElementById('m-avance').value=p.avance;document.getElementById('m-pct').value=p.pct||0;
  document.getElementById('pct-lbl').textContent=(p.pct||0)+'%';
  document.getElementById('modal-ttl').textContent='Editar pendiente';
  document.getElementById('modal-bg').classList.add('open');
}
function avanzarEstatus(idx){
  var ciclo=['Pendiente','En proceso','Completado','Atrasado'];
  pendientes[idx].estatus=ciclo[(ciclo.indexOf(pendientes[idx].estatus)+1)%ciclo.length];
  if(pendientes[idx].estatus==='Completado') pendientes[idx].pct=100;
  renderAll();
}
function eliminar(idx){if(confirm('¿Eliminar este pendiente?')){pendientes.splice(idx,1);renderAll();}}

// Iniciar
cargarDatos();
setInterval(cargarDatos, 5*60*1000);
</script>
